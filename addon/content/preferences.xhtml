<vbox
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml">
	<groupbox>
		<label><html:h2>Zotdict</html:h2></label>

		<label><html:h3>Language model</html:h3></label>

		<hbox align="center">
			<label value="Base URL" style="min-width: 140px;"/>
			<html:input type="text" style="flex: 1;" preference="__prefsPrefix__.baseURL"/>
		</hbox>

		<hbox align="center">
			<label value="API Key" style="min-width: 140px;"/>
			<html:input type="password" style="flex: 1;" preference="__prefsPrefix__.apiKey"/>
		</hbox>

		<hbox align="center">
			<label value="Model" style="min-width: 140px;"/>
			<html:input type="text" style="flex: 1;" preference="__prefsPrefix__.model"/>
		</hbox>

		<hbox align="center">
			<label value="Answer language" style="min-width: 140px;"/>
			<html:input type="text" style="flex: 1;" preference="__prefsPrefix__.targetLang"/>
		</hbox>

		<vbox>
			<label value="AI definition prompt"/>
			<html:textarea rows="4" style="width: 100%;" preference="__prefsPrefix__.cardPrompt"></html:textarea>
		</vbox>

		<separator/>

		<label><html:h3>Anki</html:h3></label>

		<checkbox
			label="Create an AIWord note when looking up a word"
			native="true"
			preference="__prefsPrefix__.ankiEnabled"/>

		<hbox align="center">
			<label value="AnkiConnect URL" style="min-width: 140px;"/>
			<html:input type="text" style="flex: 1;" preference="__prefsPrefix__.ankiConnectURL"/>
		</hbox>

		<hbox align="center">
			<label value="Deck" style="min-width: 140px;"/>
			<html:input type="text" style="flex: 1;" preference="__prefsPrefix__.ankiDeck"/>
		</hbox>

		<hbox align="center">
			<label value="Note type" style="min-width: 140px;"/>
			<html:input type="text" style="flex: 1;" preference="__prefsPrefix__.ankiModel"/>
		</hbox>

		<hbox align="center">
			<label value="Tags (comma separated)" style="min-width: 140px;"/>
			<html:input type="text" style="flex: 1;" preference="__prefsPrefix__.ankiTags"/>
		</hbox>

		<separator/>

		<label><html:h3>Dictionaries</html:h3></label>

		<hbox align="center">
			<label value="StarDict directory" style="min-width: 140px;"/>
			<html:input type="text" style="flex: 1;" preference="__prefsPrefix__.dictDir"/>
		</hbox>

		<hbox align="center">
			<label value="Lookup order" style="min-width: 140px;"/>
			<html:input type="text" style="width: 140px;" preference="__prefsPrefix__.dictOrder"/>
			<label value="e.g. oald,ode" style="color: gray; margin-left: 8px;"/>
		</hbox>

		<hbox align="center">
			<label value="Min. sentence length" style="min-width: 140px;"/>
			<html:input type="number" min="0" step="10" style="width: 100px;" preference="__prefsPrefix__.minSentenceChars"/>
		</hbox>

		<separator/>

		<label><html:h3>Annotations</html:h3></label>

		<checkbox
			label="Also save the AI definition as an annotation comment"
			native="true"
			preference="__prefsPrefix__.autoAnnotate"/>

		<hbox align="center">
			<label value="Annotation color (hex)" style="min-width: 140px;"/>
			<html:input type="text" style="width: 120px;" preference="__prefsPrefix__.annotationColor"/>
		</hbox>
	</groupbox>
</vbox>
