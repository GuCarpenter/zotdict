<?xml version="1.0" encoding="UTF-8"?>
<window
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
	title="Zotdict"
	windowtype="zotdict:popup"
	width="480"
	height="380"
	style="background:#ffffff;"
	onload="ZotdictPopup.init()">
	<html:style><![CDATA[
		#zotdict-root {
			display: flex;
			flex-direction: column;
			height: 100%;
			box-sizing: border-box;
			padding: 14px 16px;
			gap: 8px;
			overflow: hidden;
			background: #ffffff;
			color: #111111;
			font-family: -moz-default, sans-serif;
		}
		#zotdict-term {
			margin: 0;
			font-size: 15px;
			font-weight: 600;
		}
		#zotdict-body {
			flex: 1;
			overflow: auto;
			font-size: 13px;
			line-height: 1.55;
			-moz-user-select: text;
			user-select: text;
		}
		#zotdict-body h1, #zotdict-body h2, #zotdict-body h3 {
			font-size: 14px;
			margin: 10px 0 4px;
		}
		#zotdict-body p { margin: 6px 0; }
		#zotdict-body ul, #zotdict-body ol { margin: 6px 0; padding-left: 20px; }
		#zotdict-body li { margin: 2px 0; }
		#zotdict-body code {
			background: #f0f0f0;
			border-radius: 3px;
			padding: 1px 4px;
			font-family: monospace;
			font-size: 12px;
		}
		#zotdict-body pre {
			background: #f0f0f0;
			border-radius: 4px;
			padding: 8px;
			overflow: auto;
		}
		#zotdict-body pre code { background: none; padding: 0; }
		#zotdict-body blockquote {
			margin: 6px 0;
			padding-left: 10px;
			border-left: 3px solid #d0d0d0;
			color: #555;
		}
	]]></html:style>
	<html:div id="zotdict-root">
		<html:h2 id="zotdict-term"></html:h2>
		<html:div id="zotdict-body"></html:div>
	</html:div>
	<script><![CDATA[
		var ZotdictPopup = {
			init() {
				let args = window.arguments && window.arguments[0];
				if (!args) {
					return;
				}
				let term = args.term || "Zotdict";
				document.getElementById("zotdict-term").textContent = term;
				document.title = "Zotdict: " + term;

				let body = document.getElementById("zotdict-body");
				if (args.html) {
					this.renderHTML(body, args.html);
				}
				else {
					body.textContent = args.text || "";
				}
			},

			renderHTML(container, htmlString) {
				let parsed = new DOMParser().parseFromString(htmlString, "text/html");
				// Drop anything that could execute or load remote content.
				parsed.querySelectorAll(
					"script, style, link, iframe, object, embed, meta"
				).forEach(n => n.remove());
				parsed.querySelectorAll("*").forEach((el) => {
					for (let attr of Array.from(el.attributes)) {
						let name = attr.name.toLowerCase();
						let value = (attr.value || "").trim().toLowerCase();
						if (name.startsWith("on")
							|| ((name === "href" || name === "src")
								&& value.startsWith("javascript:"))) {
							el.removeAttribute(attr.name);
						}
					}
				});
				for (let node of Array.from(parsed.body.childNodes)) {
					container.appendChild(document.importNode(node, true));
				}
			}
		};
	]]></script>
</window>
