<?xml version="1.0" encoding="UTF-8"?>
<window
	xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
	title="Zotdict"
	windowtype="zotdict:popup"
	width="580"
	height="720"
	style="background:#f2efe9;"
	onload="ZotdictPopup.init()">
	<html:style><![CDATA[
		#zotdict-root {
			display: flex;
			flex-direction: column;
			height: 100%;
			box-sizing: border-box;
			padding: 10px 12px 12px;
			gap: 8px;
			overflow: hidden;
			background: #f2efe9;
			color: #1e2328;
			font-family: -moz-default, sans-serif;
		}
		#zotdict-status {
			flex: none;
			font-size: 11px;
			line-height: 1.4;
			letter-spacing: 0.02em;
			color: #5b6470;
			padding: 0 4px;
			-moz-user-select: text;
			user-select: text;
		}
		#zotdict-status.error { color: #b3261e; }
		#zotdict-status.warn { color: #8a6100; }
		#zotdict-scroll {
			flex: 1;
			overflow: auto;
			border-radius: 12px;
		}
		#zotdict-card {
			min-height: 100%;
			box-sizing: border-box;
		}
	]]></html:style>
	<html:style id="zotdict-card-style"></html:style>
	<html:div id="zotdict-root">
		<html:div id="zotdict-status"></html:div>
		<html:div id="zotdict-scroll">
			<html:div id="zotdict-card" class="card"></html:div>
		</html:div>
	</html:div>
	<script><![CDATA[
		var ZotdictPopup = {
			init() {
				let args = window.arguments && window.arguments[0];
				if (!args) {
					return;
				}
				let term = args.term || "Zotdict";
				document.title = "Zotdict: " + term;

				let status = document.getElementById("zotdict-status");
				status.textContent = args.status || "";
				if (args.statusKind === "error") status.classList.add("error");
				else if (args.statusKind === "warn") status.classList.add("warn");

				let style = document.getElementById("zotdict-card-style");
				if (args.css) style.textContent = String(args.css);

				let card = document.getElementById("zotdict-card");
				if (args.html) {
					this.renderHTML(card, args.html);
				}
				else {
					card.classList.add("empty");
					card.textContent = args.status || "No content";
				}
			},

			renderHTML(container, htmlString) {
				let parsed = new DOMParser().parseFromString(htmlString, "text/html");
				// Drop anything that could execute or load remote content.
				parsed.querySelectorAll(
					"script, style, link, iframe, object, embed, meta"
				).forEach(n => n.remove());
				parsed.querySelectorAll("*").forEach((el) => {
					for (let attr of Array.from(el.attributes)) {
						let name = attr.name.toLowerCase();
						let value = (attr.value || "").trim().toLowerCase();
						if (name.startsWith("on")
							|| ((name === "href" || name === "src")
								&& value.startsWith("javascript:"))) {
							el.removeAttribute(attr.name);
						}
					}
				});
				for (let node of Array.from(parsed.body.childNodes)) {
					container.appendChild(document.importNode(node, true));
				}
			}
		};
	]]></script>
</window>
